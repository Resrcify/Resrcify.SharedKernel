services:
  webapiexample:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    build:
      context: ../..   # the repository root: the sample builds against the SharedKernel projects
      dockerfile: samples/Resrcify.SharedKernel.WebApiExample/Dockerfile
    ports:
      - 11000:11000

  webapiexampledb:
    ports:
      - 5440:5432
