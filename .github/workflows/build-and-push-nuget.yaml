on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
jobs:
  tests:
    uses: ./.github/workflows/build-and-test.yml
  docker:
    # Publish only once the tests passed.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: nuget.org trusted publishing trades this run's GitHub identity for a short-lived API key (no stored key).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify commit exists in origin/master
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/master

      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x.x
      - name: Build
        run: dotnet build Resrcify.SharedKernel.slnx --configuration Release /p:Version=${VERSION} -m:1
      - name: Pack
        run: dotnet pack Resrcify.SharedKernel.slnx --configuration Release /p:Version=${VERSION} --no-build --output . -m:1
      - name: List generated packages
        run: ls *.nupkg
      # Every package is published at the tag's version and depends on the other SharedKernel packages at that same
      # version: a mismatch fails here, before anything reaches nuget.org.
      - name: Verify every package has the release version
        run: |
          status=0
          for package in *.nupkg; do
            case "$package" in
              *."${VERSION}".nupkg) ;;
              *) echo "::error::$package is not version ${VERSION}"; status=1 ;;
            esac
            mismatched=$(unzip -p "$package" '*.nuspec' \
              | grep -o '<dependency id="Resrcify\.SharedKernel[^"]*" version="[^"]*"' \
              | grep -v "version=\"${VERSION}\"" || true)
            if [ -n "$mismatched" ]; then
              echo "::error::$package depends on another SharedKernel version: $mismatched"
              status=1
            fi
          done
          exit $status
      # Trusted publishing: the nuget.org policy for Resrcify/Resrcify.SharedKernel, workflow build-and-push-nuget.yaml,
      # packages Resrcify.SharedKernel.*, issues a key valid for about an hour.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: RMarjanovic
      # Each package's .snupkg goes up with it. --skip-duplicate: a re-run after a failed push publishes the rest.
      - name: Push Packages to NuGet
        run: |
          for package in *.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done
